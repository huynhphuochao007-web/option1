<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bộ Sưu Tập Món Ăn Ngon Mới</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="top">Thiên Đường Ẩm Thực Thế Giới</h1>
  </header>

  <main>
    <p>Khám phá hương vị phong phú của các món ăn nổi tiếng từ khắp nơi trên thế giới. Mỗi món ăn là một câu chuyện văn hóa độc đáo!</p>

    <div class="gallery">
      <figure>
        <img src="https://images.unsplash.com/photo-1582878826629-29b7ad1cdc43?auto=format&fit=crop&w=600&q=80" alt="Tô Phở bò Việt Nam truyền thống bốc khói nghi ngút">
        <figcaption>
          <h3>Phở Bò Truyền Thống</h3>
          <p>Đặc sản Việt Nam với nước dùng đậm đà</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1565299624946-b28f40a0ae38?auto=format&fit=crop&w=600&q=80" alt="Bánh Pizza Ý phủ đầy phô mai và xốt cà chua">
        <figcaption>
          <h3>Pizza Ý Phô Mai</h3>
          <p>Món ăn kinh điển đến từ nước Ý</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1579871494447-9811cf80d66c?auto=format&fit=crop&w=600&q=80" alt="Cơm cuộn Sushi Nhật Bản tươi ngon xếp đẹp mắt">
        <figcaption>
          <h3>Sushi Nhật Bản</h3>
          <p>Sự kết tinh tinh tế của ẩm thực xứ Phù Tang</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd?auto=format&fit=crop&w=600&q=80" alt="Bánh Burger bò nướng hai tầng kèm phô mai chảy">
        <figcaption>
          <h3>Burger Bò Nướng</h3>
          <p>Món ăn nhanh hấp dẫn và giàu năng lượng</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1555126634-323283e090fa?auto=format&fit=crop&w=600&q=80" alt="Đĩa Mì Ý Xốt Cà Chua thơm ngon">
        <figcaption>
          <h3>Mì Ý Spaghetti</h3>
          <p>Hương vị xốt cà chua và thịt băm đậm đà</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1509722747041-616f39b57569?auto=format&fit=crop&w=600&q=80" alt="Bánh ổ Bánh Mì kẹp thịt nướng giòn rụm Việt Nam">
        <figcaption>
          <h3>Bánh Mì Việt Nam</h3>
          <p>Món ăn đường phố nổi tiếng toàn cầu</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1563379091339-03b21ab4a4f8?auto=format&fit=crop&w=600&q=80" alt="Mì Ramen Nhật Bản béo ngậy trứng lòng đào">
        <figcaption>
          <h3>Ramen Nhật Bản</h3>
          <p>Tô mì đậm đà ấm áp cho ngày đông</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1567620905732-2d1ec7ab7445?auto=format&fit=crop&w=600&q=80" alt="Đĩa Bánh Kếp Mật Ong phủ dâu tây tươi">
        <figcaption>
          <h3>Bánh Kếp Mật Ong</h3>
          <p>Món tráng miệng ngọt ngào trọn vị</p>
        </figcaption>
      </figure>

      <figure>
        <img src="https://images.unsplash.com/photo-1565958011703-44f9829ba187?auto=format&fit=crop&w=600&q=80" alt="Bánh Kem Dâu Tây trang trí đẹp mắt">
        <figcaption>
          <h3>Bánh Kem Dâu Tây</h3>
          <p>Hương vị tươi mát và béo ngậy</p>
        </figcaption>
      </figure>
    </div>
  </main>

  <footer>
    <a href="#top">Trở về đầu trang</a>
  </footer>
</body>

</html>
